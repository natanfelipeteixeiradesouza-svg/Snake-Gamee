# Jogo da Cobrinha Completo

```html
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jogo da Cobrinha Neon</title>

    <style>

        *{
            margin: 0;

            box-sizing: border-box;
        }

        body{
            min-height: 100vh;

            display: flex;
            justify-content: center;

                0 0 40px #00f0ff33;

            margin-bottom: 20px;

            display: flex;

        }

</head>

<body>

    <div class="container">

        <h1>🐍 Jogo da Cobrinha</h1>

        <div class="info">

            <div class="pontuacao">
                Pontuação: <span id="pontos">0</span>
            </div>

            <div class="recorde">
                Recorde: <span id="recorde">0</span>
            </div>

        </div>

        <canvas id="canvas" width="400" height="400"></canvas>

        <div class="game-over" id="gameOverTexto">
            GAME OVER
        </div>

        <div class="controles">

            <button onclick="iniciarJogo()">
                Iniciar Jogo
            </button>

            <button onclick="pausarJogo()">
                Pausar / Continuar
            </button>

        </div>

        <div class="teclas">

            <div class="tecla vazio"></div>

            <div class="tecla" onclick="mudarDirecao('cima')">
                ▲
            </div>

            <div class="tecla vazio"></div>

            <div class="tecla" onclick="mudarDirecao('esquerda')">
                ◀
            </div>

            <div class="tecla" onclick="mudarDirecao('baixo')">
                ▼
            </div>

            <div class="tecla" onclick="mudarDirecao('direita')">
                ▶
            </div>

        </div>

        <div class="instrucoes">

            <h3>Como Jogar:</h3>

            <p>
                Use as setas do teclado ou os botões.
            </p>

            <p>
                Pegue as maçãs 🍎 para ganhar pontos.
            </p>

            <p>
                Não bata na parede nem em você mesmo.
            </p>

        </div>

    </div>

    <script>

        // =============================
        // CANVAS
        // =============================

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // =============================
        // CONFIGURAÇÕES
        // =============================

        const tamanhoQuadrado = 20;

        const quantidadeQuadrados =
            canvas.width / tamanhoQuadrado;

        // =============================
        // VARIÁVEIS
        // =============================

        let cobra;
        let direcao;
        let proximaDirecao;

        let comida;

        let pontos;
        let recorde;

        let jogoAtivo;
        let jogoPausado;

        let intervaloJogo;

        // =============================
        // RECORDE
        // =============================

        recorde =
            localStorage.getItem('recordeCobrinha') || 0;

        document.getElementById('recorde').textContent =
            recorde;

        // =============================
        // INICIAR JOGO
        // =============================

        function iniciarJogo(){

            cobra = [
                {x: 10, y: 10},
                {x: 9, y: 10},
                {x: 8, y: 10}
            ];

            direcao = 'direita';
            proximaDirecao = 'direita';

            pontos = 0;

            jogoAtivo = true;
            jogoPausado = false;

            document.getElementById('pontos').textContent =
                pontos;

            document.getElementById('gameOverTexto').style.display =
                'none';

            gerarComida();

            if(intervaloJogo){
                clearInterval(intervaloJogo);
            }

            intervaloJogo =
                setInterval(atualizarJogo, 100);

            desenhar();
        }

        // =============================
        // LOOP PRINCIPAL
        // =============================

        function atualizarJogo(){

            if(!jogoAtivo || jogoPausado){
                return;
            }

            direcao = proximaDirecao;

            let cabeca = { ...cobra[0] };

            // MOVIMENTO

            if(direcao === 'direita'){
                cabeca.x++;
            }

            if(direcao === 'esquerda'){
                cabeca.x--;
            }

            if(direcao === 'cima'){
                cabeca.y--;
            }

            if(direcao === 'baixo'){
                cabeca.y++;
            }

            // COLISÃO COM PAREDE

            if(
                cabeca.x < 0 ||
                cabeca.y < 0 ||
                cabeca.x >= quantidadeQuadrados ||
                cabeca.y >= quantidadeQuadrados
            ){
                fimDeJogo();
                return;
            }

            // COLISÃO COM CORPO

            for(let pedaco of cobra){

                if(
                    cabeca.x === pedaco.x &&
                    cabeca.y === pedaco.y
                ){
                    fimDeJogo();
                    return;
                }
            }

            // ADICIONAR CABEÇA

            cobra.unshift(cabeca);

            // PEGAR COMIDA

            if(
                cabeca.x === comida.x &&
                cabeca.y === comida.y
            ){

                pontos++;

                document.getElementById('pontos').textContent =
                    pontos;

                // aumentar velocidade

                if(pontos % 5 === 0){

                    clearInterval(intervaloJogo);

                    intervaloJogo =
                        setInterval(
                            atualizarJogo,
                            Math.max(50, 100 - pontos * 2)
                        );
                }

                // recorde

                if(pontos > recorde){

                    recorde = pontos;

                    localStorage.setItem(
                        'recordeCobrinha',
                        recorde
                    );

                    document.getElementById('recorde').textContent =
                        recorde;
                }

                gerarComida();

            }else{

                cobra.pop();
            }

            desenhar();
        }

        // =============================
        // DESENHAR
        // =============================

        function desenhar(){

            // FUNDO

            ctx.fillStyle = '#020617';

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            // GRADE

            ctx.strokeStyle = '#111827';
            ctx.lineWidth = 0.5;

            for(let i = 0; i <= quantidadeQuadrados; i++){

                // vertical

                ctx.beginPath();
                ctx.moveTo(i * tamanhoQuadrado, 0);
                ctx.lineTo(i * tamanhoQuadrado, canvas.height);
                ctx.stroke();

                // horizontal

                ctx.beginPath();
                ctx.moveTo(0, i * tamanhoQuadrado);
                ctx.lineTo(canvas.width, i * tamanhoQuadrado);
                ctx.stroke();
            }

            // COBRA

            cobra.forEach((pedaco, indice) => {

                let cor = '#4CAF50';

                if(indice === 0){
                    cor = '#00ff88';
                }

                ctx.fillStyle = cor;

                ctx.fillRect(
                    pedaco.x * tamanhoQuadrado + 1,
                    pedaco.y * tamanhoQuadrado + 1,
                    tamanhoQuadrado - 2,
                    tamanhoQuadrado - 2
                );

                // brilho

                ctx.fillStyle = 'rgba(255,255,255,0.2)';

                ctx.fillRect(
                    pedaco.x * tamanhoQuadrado + 3,
                    pedaco.y * tamanhoQuadrado + 3,
                    tamanhoQuadrado / 2,
                    tamanhoQuadrado / 2
                );
            });

            // COMIDA

            ctx.fillStyle = '#ff0033';

            ctx.beginPath();

            ctx.arc(
                comida.x * tamanhoQuadrado + tamanhoQuadrado / 2,
                comida.y * tamanhoQuadrado + tamanhoQuadrado / 2,
                tamanhoQuadrado / 2 - 2,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        // =============================
        // GERAR COMIDA
        // =============================

        function gerarComida(){

            let posicaoValida = false;

            while(!posicaoValida){

                comida = {
                    x: Math.floor(Math.random() * quantidadeQuadrados),
                    y: Math.floor(Math.random() * quantidadeQuadrados)
                };

                posicaoValida = true;

                for(let pedaco of cobra){

                    if(
                        comida.x === pedaco.x &&
                        comida.y === pedaco.y
                    ){
                        posicaoValida = false;
                        break;
                    }
                }
            }
        }

        // =============================
        // DIREÇÃO
        // =============================

        function mudarDirecao(novaDirecao){

            if(
                novaDirecao === 'cima' &&
                direcao !== 'baixo'
            ){
                proximaDirecao = novaDirecao;
            }

            if(
                novaDirecao === 'baixo' &&
                direcao !== 'cima'
            ){
                proximaDirecao = novaDirecao;
            }

            if(
                novaDirecao === 'esquerda' &&
                direcao !== 'direita'
            ){
                proximaDirecao = novaDirecao;
            }

            if(
                novaDirecao === 'direita' &&
                direcao !== 'esquerda'
            ){
                proximaDirecao = novaDirecao;
            }
        }

        // =============================
        // PAUSAR
        // =============================

        function pausarJogo(){

            jogoPausado = !jogoPausado;
        }

        // =============================
        // GAME OVER
        // =============================

        function fimDeJogo(){

            jogoAtivo = false;

            clearInterval(intervaloJogo);

            document.getElementById('gameOverTexto').style.display =
                'block';
        }

        // =============================
        // CONTROLE TECLADO
        // =============================

        document.addEventListener('keydown', (evento) => {

            if(evento.key === 'ArrowUp'){
                mudarDirecao('cima');
            }

            if(evento.key === 'ArrowDown'){
                mudarDirecao('baixo');
            }

            if(evento.key === 'ArrowLeft'){
                mudarDirecao('esquerda');
            }

            if(evento.key === 'ArrowRight'){
                mudarDirecao('direita');
            }

            // reiniciar rápido

            if(evento.key.toLowerCase() === 'r'){
                iniciarJogo();
            }
        });

    </script>

</body>
</html>
